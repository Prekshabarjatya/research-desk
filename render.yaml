# Render Blueprint, free-tier version: one web service (API + UI + worker in one process).
# The database is an external free Postgres (Neon or Supabase), not a Render database.
# Free web services spin down after idle time; runs are checkpointed and resume on wake.
# Plan names and limits change, so confirm them in the Render dashboard.
services:
  - type: web
    name: research-desk
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL    # your Neon/Supabase connection string, the direct (non-pooled) one
        sync: false
      - key: OPENROUTER_API_KEY    # you are prompted for this on first deploy
        sync: false
      - key: API_TOKEN       # generated by Render; read it in the dashboard, it is your sign-in token
        generateValue: true
      - key: RUN_WORKER
        value: "1"
      - key: CORS_ORIGINS    # only if you host the UI on Vercel, e.g. https://your-app.vercel.app
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
